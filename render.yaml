services:
  - type: web
    name: gradpath-backend
    runtime: docker
    dockerfilePath: ./gradpath_backend/Dockerfile
    dockerContext: ./gradpath_backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gradpath-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ENVIRONMENT
        value: production

databases:
  - name: gradpath-db
    databaseName: gradpath
    user: gradpath
